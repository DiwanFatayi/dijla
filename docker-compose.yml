services:
  postgres:
    image: postgres:16-alpine
    container_name: dijla-postgres
    environment:
      POSTGRES_USER: dijla
      POSTGRES_PASSWORD: dijla
      POSTGRES_DB: dijla
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dijla -d dijla"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  memgraph:
    image: memgraph/memgraph:2.18
    container_name: dijla-memgraph
    command: ["--log-level=WARNING", "--also-log-to-stderr=true"]
    ports:
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --output-format=csv || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - memgraph-data:/var/lib/memgraph

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: dijla-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: dijla
      MINIO_ROOT_PASSWORD: dijla-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - minio-data:/data

  app:
    build: .
    container_name: dijla-app
    depends_on:
      postgres:
        condition: service_healthy
      memgraph:
        condition: service_started
      minio:
        condition: service_started
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://dijla:dijla@postgres:5432/dijla
      MEMGRAPH_HOST: memgraph
      MEMGRAPH_PORT: "7687"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: dijla
      MINIO_SECRET_KEY: dijla-secret
      LANGGRAPH_CHECKPOINT_BACKEND: memory
    ports:
      - "8000:8000"

volumes:
  postgres-data:
  memgraph-data:
  minio-data:
